<!doctype html>
<html lang="en">
  <head>
    <title>shadow-claw-light-meter - redirect service</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="shadow-claw-light-meter - redirect service"
    />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        const l = window.location;
        const isLocalhost =
          l.hostname === "localhost" ||
          l.hostname === "127.0.0.1" ||
          l.hostname === "0.0.0.0";

        if (isLocalhost) return;

        // store the full path + query + hash
        sessionStorage.setItem(
          "shadow-claw-github-pages-404-redirect",
          l.pathname + l.search + l.hash,
        );

        // redirect to entry point
        l.replace("/shadow-claw-light-meter/");
      })();
    </script>
  </head>
  <body>
    <main
      style="
        font-family: system-ui, sans-serif;
        padding: 2rem;
        max-width: 40rem;
        margin: auto;
        line-height: 1.6;
      "
    >
      <h1>404 Not Found</h1>
      <p>
        The requested path does not exist on
        <strong>TinyDuino LightMeter</strong>.
      </p>
      <h2>Where to look next</h2>
      <ul>
        <li><a href="/shadow-claw-light-meter/">TinyDuino LightMeter</a></li>
        <li>
          <a href="/shadow-claw-light-meter/sitemap.xml"
            >Site Map (sitemap.xml)</a
          >
        </li>
        <li>
          <a href="/shadow-claw-light-meter/llms.txt"
            >Agent Instructions (llms.txt)</a
          >
        </li>
        <li>
          <a href="https://github.com/xt-ml/shadow-claw-light-meter"
            >GitHub Repository &amp; Docs</a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
